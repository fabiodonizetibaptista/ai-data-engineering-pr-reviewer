name: Engineering Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-static-analysis:
    name: Python Static Analysis (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.13.3

      - name: Execute Ruff enforcement
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Python static analysis..."

          # Capture the Ruff result without prematurely terminating
          # the shell. This ensures diagnostics are still published
          # when lint violations cause a non-zero exit code.
          if ruff check src tests \
              --output-format concise \
              > "$RUNNER_TEMP/ruff-findings.txt" 2>&1; then
            ruff_status=0
          else
            ruff_status=$?
          fi

          # Keep the original output visible in the job logs.
          cat "$RUNNER_TEMP/ruff-findings.txt"

          {
            echo "## Engineering Quality Gate"
            echo ""
            echo "### Ruff - Python Static Analysis"
            echo ""
            echo "Mode: enforcement (blocking)"
            echo ""
            echo "Ruff exit code: $ruff_status"
            echo ""
            echo '```text'

            # Statistics are informational. The original exit code
            # remains the authoritative outcome of this quality gate.
            ruff check src tests --statistics --exit-zero ||
              echo "Statistics unavailable."

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job when the initial Ruff execution failed.
          exit "$ruff_status"
