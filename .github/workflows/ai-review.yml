name: Reusable AI Data Engineering Review

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout AI reviewer
        uses: actions/checkout@v7
        with:
          repository: fabiodonizetibaptista/ai-data-engineering-pr-reviewer
          ref: main
          path: .ai-reviewer

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install reviewer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .ai-reviewer/requirements.txt

      - name: List repository root files
        run: ls -la

      - name: List pull request changed files
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Prepare pull request diff
        run: |
          git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > /tmp/pr.diff

          echo "Pull request diff generated successfully."
          echo "Diff lines: $(wc -l < /tmp/pr.diff)"
          echo "Diff size (bytes): $(wc -c < /tmp/pr.diff)"

      - name: Run AI reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .ai-reviewer/src/reviewer.py

      - name: Upload AI review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-data-engineering-review
          path: /tmp/ai-review.md

      - name: Show pull request context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Pull Request: #${{ github.event.pull_request.number }}"
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"