name: Reviewer Tests

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Unit Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -v --cov=src --cov-report=term-missing

      - name: Publish coverage summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Test Coverage"
            echo ""
            echo "Mode: measurement only (no minimum threshold yet)"
            echo ""
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"