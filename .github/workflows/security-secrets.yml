name: Security - Secret Scanning

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.24.3"
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          ARCHIVE="$RUNNER_TEMP/$ASSET"
          CHECKSUMS="$RUNNER_TEMP/gitleaks-checksums.txt"
          INSTALL_DIR="$RUNNER_TEMP/gitleaks-bin"

          mkdir -p "$INSTALL_DIR"

          # Download the binary and official checksum manifest.
          # Do not execute the downloaded binary before verification.
          curl --fail --silent --show-error \
            --location --retry 3 \
            "$BASE_URL/$ASSET" \
            --output "$ARCHIVE"

          curl --fail --silent --show-error \
            --location --retry 3 \
            "$BASE_URL/gitleaks_${VERSION}_checksums.txt" \
            --output "$CHECKSUMS"

          # Locate exactly one SHA-256 entry for the expected asset.
          # Accept standard sha256sum formats: filename or *filename.
          expected_hash=""

          while read -r hash filename remaining; do
            filename="${filename#\*}"

            if [[ "$filename" == "$ASSET" ]]; then
              if [[ -n "$expected_hash" ]]; then
                echo "Duplicate checksum entry. Installation stopped."
                exit 1
              fi

              if [[ ! "$hash" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "Invalid checksum format. Installation stopped."
                exit 1
              fi

              expected_hash="$hash"
            fi
          done < "$CHECKSUMS"

          if [[ -z "$expected_hash" ]]; then
            echo "Expected checksum entry not found."
            exit 1
          fi

          actual_hash="$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)"

          if [[ "${actual_hash,,}" != "${expected_hash,,}" ]]; then
            echo "Gitleaks SHA-256 verification failed."
            exit 1
          fi

          echo "Gitleaks SHA-256 verification passed."

          # Extraction only happens after checksum verification.
          tar -xzf "$ARCHIVE" -C "$INSTALL_DIR" gitleaks
          chmod +x "$INSTALL_DIR/gitleaks"

          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

          rm -f "$ARCHIVE" "$CHECKSUMS"
      - name: Scan repository snapshot
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/gitleaks-findings.json"
          export REPORT

          # Findings may contain sensitive evidence.
          # Keep raw scanner output and report out of public logs.
          if gitleaks dir . \
            --redact=100 \
            --no-banner \
            --log-level error \
            --report-format json \
            --report-path "$REPORT" \
            > /dev/null 2>&1; then
            scan_status=0
          else
            scan_status=$?
          fi

          # Only output the aggregate number of findings.
          # Never output secrets, matching lines or file contents.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["REPORT"])

          if report.exists():
              findings = json.loads(report.read_text(encoding="utf-8"))
              if not isinstance(findings, list):
                  raise ValueError("Unexpected Gitleaks report structure.")
              count = len(findings)
          else:
              count = 0

          print(f"Potential secret findings: {count}")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("## Secret Scanning\n\n")
              summary.write("Tool: Gitleaks 8.24.3\n\n")
              summary.write("Scope: repository snapshot\n\n")
              summary.write(f"Potential findings: {count}\n\n")
              summary.write(
                  "Sensitive findings are not published in logs "
                  "or workflow artifacts.\n"
              )
          PY

          # A leak fails the quality gate.
          # Other scanner failures must not be treated as success.
          if [ "$scan_status" -eq 1 ]; then
            echo "Secret scanning detected potential credentials."
          elif [ "$scan_status" -ne 0 ]; then
            echo "Secret scanning failed to complete."
          fi

          rm -f "$REPORT"

          exit "$scan_status"
